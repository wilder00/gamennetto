[package]
name = "gamennetto"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Use your phone or another PC as a second screen."

[dependencies]
gamennetto-probe = { path = "../../crates/probe" }
gamennetto-capture = { path = "../../crates/capture" }
gamennetto-encode = { path = "../../crates/encode" }
gamennetto-net = { path = "../../crates/net" }
gamennetto-input = { path = "../../crates/input" }
gamennetto-decode = { path = "../../crates/decode" }
gamennetto-vdisplay = { path = "../../crates/vdisplay" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dialoguer = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
winit = "0.30"
raw-window-handle = "0.6"
minisign-verify = "0.2"
base64 = "0.22"

[dev-dependencies]
minisign = "0.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
