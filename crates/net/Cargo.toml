[package]
name = "gamennetto-net"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Encrypted QUIC transport, pairing codes, protocol messages and LAN discovery."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
mdns-sd = "0.22"
